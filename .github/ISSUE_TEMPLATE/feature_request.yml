name: 💡 Feature Request
description: Suggest an idea or enhancement for s'Dart App
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new feature or improvement? Let us know!
  - type: textarea
    id: problem
    attributes:
      label: What problem or need should be solved?
      description: A clear description of the problem (e.g. "I'm missing Shanghai game mode...").
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you envision the implementation or the UI?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Considered Alternatives
      description: What alternative solutions have you considered?
