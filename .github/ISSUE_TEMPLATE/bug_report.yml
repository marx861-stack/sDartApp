name: 🐛 Bug Report
description: Report an issue or unexpected behavior in the app
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug!
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform did the bug occur on?
      options:
        - Desktop (Windows)
        - Desktop (Linux)
        - Desktop (macOS)
        - Android
        - iOS
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App Version / Commit Hash
      placeholder: e.g. v1.0.0 or git commit hash
    validations:
      required: true
  - type: textarea
    id: camera_info
    attributes:
      label: Camera Hardware & Resolution
      description: If relevant, specify the camera model and resolution (e.g. Logitech C920 1080p, Pixel 7).
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happens exactly?
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: How can the issue be reproduced?
      placeholder: |
        1. Launch the app
        2. Select game mode X01
        3. Activate camera...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Screenshots
      description: Paste console output or attach screenshots here.
